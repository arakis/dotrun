services:
  postgres:
    image: postgres:16-alpine
    container_name: dotrun-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dotrun
    ports:
      - "14080:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: dotrun-postgres-data
